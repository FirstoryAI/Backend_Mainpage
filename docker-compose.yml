services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: firstory
      POSTGRES_USER: firstory
      POSTGRES_PASSWORD: firstory
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # 로컬에 PostgreSQL이 이미 떠 있으면 POSTGRES_PORT로 바꾼다
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
