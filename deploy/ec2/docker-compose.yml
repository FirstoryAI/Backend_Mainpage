# EC2 개발 서버: Postgres + Spring + AI 워커 + Caddy(HTTPS). 설명은 docs/deploy/ec2.md
#
#   cd deploy/ec2 && cp .env.example .env   # 값 채우기
#   docker compose up -d --build
#
# 공개되는 것은 Caddy(80, 443)뿐이다. Postgres와 AI 워커는 compose 내부망에서만 보인다.
# 그림은 S3 버킷 하나를 Spring과 AI가 같이 쓴다. 접근 키 대신 EC2 IAM 역할 (IMDS hop limit 2 필요)

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}   # Railway DB와 같은 메이저 버전 (11/2 기준 18.6). 덤프는 낮은 버전에 복원되지 않는다
    restart: unless-stopped
    environment:
      POSTGRES_DB: firstory
      POSTGRES_USER: firstory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣어 주세요}
    volumes:
      # 18부터 공식 이미지의 데이터 위치가 /var/lib/postgresql/18/docker다. 예전처럼 .../data에 붙이면 기동을 거부한다.
      # 16 이하 이미지로 바꾸면 /var/lib/postgresql/data로 되돌린다
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstory -d firstory"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  ai:
    build: ${AI_DIR:-../../../AI_worker}   # AI_worker 저장소. 기본은 이 저장소 옆에 clone한 폴더
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY를 .env에 넣어 주세요}
      FIRSTORY_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN을 .env에 넣어 주세요}
      FIRSTORY_STORAGE: s3
      FIRSTORY_S3_BUCKET: ${S3_BUCKET:?S3_BUCKET을 .env에 넣어 주세요}
      FIRSTORY_S3_REGION: ${S3_REGION:-ap-northeast-2}
      IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-3}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    volumes:
      - ai-data:/data   # 체크포인트 (/data/checkpoints.db). 지워지면 만들던 동화가 409로 끊긴다
    mem_limit: 1g

  backend:
    build: ../..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/firstory
      DB_USERNAME: firstory
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Railway와 같은 값을 쓴다. 다르면 로그인 유지(FREMEMBER) 토큰이 모두 무효가 된다
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:?REMEMBER_ME_KEY를 .env에 넣어 주세요}
      # 인증번호·알림 메일. 기본 log(보내지 않고 로그만, 인증번호 000000). 실제로 보내려면 .env에 MAIL_MODE=smtp와 팀 Gmail 계정·앱 비밀번호
      # 기본값을 smtp로 두면 키가 없는 서버는 배포하자마자 기동하지 않는다 (#47)
      MAIL_MODE: ${MAIL_MODE:-log}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # 카카오 로그인. 기본 fake(아무 code로 가짜 회원). 진짜 카카오는 .env에 KAKAO_MODE=http와 KAKAO_REST_API_KEY (#47)
      KAKAO_MODE: ${KAKAO_MODE:-fake}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URIS: ${KAKAO_REDIRECT_URIS:-}
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: ""   # 프론트(Vercel)가 /api를 프록시해서 같은 출처. 비워야 CORS 403이 안 난다
      AI_MODE: http
      AI_BASE_URL: http://ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      STORAGE_TYPE: s3
      STORAGE_S3_BUCKET: ${S3_BUCKET}
      STORAGE_S3_REGION: ${S3_REGION:-ap-northeast-2}
    mem_limit: 1536m   # 힙은 이 값의 75% (Dockerfile JAVA_TOOL_OPTIONS)

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"     # Let's Encrypt 인증과 HTTPS로 넘기기
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN을 .env에 넣어 주세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # 인증서. 지우면 다시 받는다 (Let's Encrypt 발급 횟수 제한 주의)
      - caddy-config:/config
    mem_limit: 128m

volumes:
  postgres-data:
  ai-data:
  caddy-data:
  caddy-config:
