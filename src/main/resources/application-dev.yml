# 개발 서버(Railway) 설정. 환경 변수 SPRING_PROFILES_ACTIVE=dev로 켠다.
# 넣어야 할 환경 변수 전체와 예시값은 docs/deploy/railway.md
#
# 프론트가 진짜에 가까운 환경에서 붙여 보는 서버다. 운영(prod)이 아니다.
# - Swagger 켬 (application.yml의 on-profile: local | dev 문서)
# - 가짜 AI (local 예시값과 같은 속도), 문자는 보내지 않고 로그만 (LoggingSmsSender)
# - 고정 인증번호 000000. 누구나 아무 번호로 가입할 수 있으니 실제 개인정보를 넣지 않는다

spring:
  datasource:
    # dev는 로컬 기본값(localhost)으로 뜨지 않게 기본값 없이 받는다. 비어 있으면 기동 실패
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

firstory:
  crypto:
    # application.yml의 기본값은 저장소에 공개된 로컬용이다. dev는 반드시 새로 만든 값을 넣는다 (없으면 기동 실패)
    phone-aes-key: ${PHONE_AES_KEY}
    phone-hmac-key: ${PHONE_HMAC_KEY}
  auth:
    remember-me-key: ${REMEMBER_ME_KEY}
  ai:
    mode: ${AI_MODE:fake}
    fake:                     # local 예시값과 같다 (docs/frontend/fake-ai.md)
      interview-delay: 2s
      safety-delay: 1s
      stage-duration: 40s     # 생성 약 2분 40초
      turns: 0                # 동화마다 질문 1~5개
  sms:
    local-fixed-code: "000000"   # local, dev에서만 허용. 다른 프로필에 넣으면 기동 실패
  web:
    cookie-secure: ${COOKIE_SECURE:true}   # Railway는 HTTPS로 서비스한다
