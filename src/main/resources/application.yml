server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: firstory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/firstory}
    username: ${DB_USERNAME:firstory}
    password: ${DB_PASSWORD:firstory}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 30m               # 유휴 만료
    jdbc:
      initialize-schema: never   # 스키마는 Flyway V2가 만든다

# Swagger는 기본으로 끈다 (운영). local 프로필에서만 아래 문서로 켠다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

firstory:
  crypto:
    # 32바이트 Base64. 아래 기본값은 로컬 개발용이다. 운영은 반드시 환경 변수로 넣는다
    phone-aes-key: ${PHONE_AES_KEY:LlNjGbl6PF959ZAmeT0cgo7fB8RzybmscK7lwJIujzA=}
    phone-hmac-key: ${PHONE_HMAC_KEY:Chg1Q+ecsxbaP3RFwbIYhmQvksrUc1XG03McsuGB+Jk=}
  story:
    page-count: 8                               # 동화 쪽수. DB에는 상한을 두지 않는다
  policy:
    max-regenerations: ${MAX_REGENERATIONS:3}   # TODO(PM): 다시 만들기 최대 횟수 미정 (결정 4번). 임시값 3
    safety-revise-limit: 2                      # 위기 신호 REVISE가 이 횟수째면 차단 (1번째는 다시 쓰기 안내)
  ai:
    mode: ${AI_MODE:http}                       # http | fake. local, test 프로필은 fake (AI 서버 없이 고정 응답)
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_TOKEN:}       # X-Internal-Token. mode=http인데 비어 있으면 기동 실패
    connect-timeout: 3s
    read-timeout: 35s                           # 인터뷰 API는 30초 이내 응답 (스펙 v0.3)
    fake:                                       # mode=fake일 때 가짜 AI의 속도와 질문 수. test는 이 값 그대로 (바로 응답)
      interview-delay: 0s                       # 인터뷰 시작, 답변 응답 전에 기다리는 시간
      safety-delay: 0s                          # 위기 신호 검사 응답 전에 기다리는 시간
      stage-duration: 0s                        # 생성 한 단계 시간. 0이면 진행 확인(status)마다 한 단계씩
      turns: 2                                  # 첫 질문 뒤에 더 묻는 질문 수(질문 3개). 0이면 동화마다 질문 1~5개
  generation:
    poll-enabled: true                          # test 프로필은 false (테스트가 pollOnce()를 직접 부른다)
    poll-interval: 5s                           # AI에 진행 상태를 묻는 간격
    timeout: 15m                                # 시작하고 이 시간이 지나도 RUNNING이면 실패 처리
  storage:
    local-root: ${STORAGE_LOCAL_ROOT:./data/storage}   # 그림 파일 저장 폴더 (커밋하지 않는다)
  web:
    cookie-secure: ${COOKIE_SECURE:false}                      # 운영은 true
    cookie-domain: ${COOKIE_DOMAIN:}                           # API를 서브도메인으로 나눌 때만 설정
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}  # 쉼표로 구분. 같은 출처 배포면 비운다
  auth:
    # 아래 기본값은 로컬 개발용이다. 운영은 반드시 환경 변수로 넣는다
    remember-me-key: ${REMEMBER_ME_KEY:local-remember-me-key-change-me}

---
# local 프로필 전용: Swagger UI (/swagger-ui/index.html), API 문서 (/v3/api-docs)
spring:
  config:
    activate:
      on-profile: local
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    csrf:
      enabled: true   # XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더로 붙여 보낸다
    operations-sorter: method
    tags-sorter: alpha

---
# test 프로필 전용: AI 서버 없이 FakeAiClient로 돈다
spring:
  config:
    activate:
      on-profile: test
firstory:
  ai:
    mode: fake
  generation:
    poll-enabled: false
  storage:
    local-root: build/test-storage
