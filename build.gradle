plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.firstory'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'   // 세션 저장소: PostgreSQL

    // Swagger. springdoc은 Spring Boot BOM이 관리하지 않아 버전을 적는다.
    // 3.1.x가 Spring Boot 4.1 기준 (3.1.0에서 Boot 4.1.0으로 올림). Boot를 올리면 springdoc 호환 버전도 함께 확인한다
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // Flyway: 스타터 + PostgreSQL 모듈. 버전 적지 않음
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'   // @DataJpaTest
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'     // MockMvc
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'   // spring-security-test 포함
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // FrontendErrorsDocTest가 docs/frontend/errors.md를 읽는다. 문서만 바뀌어도 테스트를 다시 돌린다
    inputs.dir('docs/frontend').withPathSensitivity(PathSensitivity.RELATIVE)
}
